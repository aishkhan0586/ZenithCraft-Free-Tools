<div class="tool-wrap"><div class="tool-inner">
<div class="card">
  <div style="border:2px dashed var(--border);border-radius:12px;padding:48px 24px;text-align:center;cursor:pointer;position:relative" id="dz">
    <div style="font-size:2.5rem;margin-bottom:12px">🧬</div>

    <input type="file" id="fi" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer"/>
  </div>
</div>
<div id="res" style="display:none" class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px">
    <span style="font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)">Base64 Output</span>
    <div style="display:flex;gap:8px">
      <button id="fmtHtml" onclick="setOutputFmt('html',this)" style="padding:7px 14px;border-radius:7px;background:var(--grad);color:#fff;font-size:.775rem;font-weight:700;border:none;cursor:pointer">HTML img src</button>
      <button id="fmtCss" onclick="setOutputFmt('css',this)" style="padding:7px 14px;border-radius:7px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:.775rem;font-weight:700;cursor:pointer">CSS url()</button>
      <button id="fmtRaw" onclick="setOutputFmt('raw',this)" style="padding:7px 14px;border-radius:7px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:.775rem;font-weight:700;cursor:pointer">Raw Base64</button>
    </div>
  </div>
  <textarea id="b64out" readonly style="width:100%;height:160px;padding:14px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:monospace;font-size:.78rem;border-radius:10px;resize:vertical;outline:none;line-break:anywhere"></textarea>
  <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
    <button onclick="copyOutput()" style="flex:1;padding:12px;border-radius:10px;background:var(--grad);font-size:.9rem;font-weight:700;color:#fff;border:none;cursor:pointer" id="copyBtn">📋 Copy</button>
    <span id="sizeInfo" style="display:flex;align-items:center;font-size:.82rem;color:var(--text3)"></span>
  </div>
</div>
</div></div>
<script>
let b64data='',mimeType='';
let outputFmt='html';
function setOutputFmt(fmt,btn){outputFmt=fmt;document.querySelectorAll('#res button').forEach(b=>{if(['HTML img src','CSS url()','Raw Base64'].includes(b.textContent)){b.style.background='var(--bg3)';b.style.color='var(--text2)';b.style.border='1px solid var(--border)'}});btn.style.background='linear-gradient(135deg,#7c3aed,#a855f7,#06b6d4)';btn.style.color='#fff';btn.style.border='none';updateOutput();}
function updateOutput(){const ta=document.getElementById('b64out');const full='data:'+mimeType+';base64,'+b64data;if(outputFmt==='html')ta.value='<img src="'+full+'" alt="image"/>';else if(outputFmt==='css')ta.value='background-image: url("'+full+'");';else ta.value=b64data;}
document.getElementById('fi').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;mimeType=f.type;const r=new FileReader();r.onload=ev=>{const full=ev.target.result;b64data=full.split(',')[1];document.getElementById('res').style.display='block';document.getElementById('sizeInfo').textContent='Base64 size: '+formatBytes(b64data.length);updateOutput();};r.readAsDataURL(f);});
function copyOutput(){navigator.clipboard.writeText(document.getElementById('b64out').value).then(()=>{const btn=document.getElementById('copyBtn');btn.textContent='✅ Copied!';setTimeout(()=>btn.textContent='📋 Copy',2000);});}
function formatBytes(b){if(b>=1048576)return(b/1048576).toFixed(2)+' MB';if(b>=1024)return(b/1024).toFixed(1)+' KB';return b+' B';}
</script>
