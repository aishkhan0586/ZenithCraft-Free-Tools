<div class="tool-wrap"><div class="tool-inner">
<div class="card">
  <div style="border:2px dashed var(--border);border-radius:12px;padding:48px 24px;text-align:center;cursor:pointer;position:relative" id="dz">

    <input type="file" id="fi" accept=".svg,image/svg+xml" style="position:absolute;inset:0;opacity:0;cursor:pointer"/>

</div>
<div id="sp" style="display:none" class="card">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
    <div><label style="font-size:.85rem;font-weight:600;color:var(--text2);display:block;margin-bottom:6px">Width (px)</label><input type="number" id="pw" placeholder="512" style="width:100%;padding:11px 14px;border-radius:9px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:.95rem;font-family:Inter;outline:none"/></div>
    <div><label style="font-size:.85rem;font-weight:600;color:var(--text2);display:block;margin-bottom:6px">Height (px)</label><input type="number" id="ph" placeholder="512" style="width:100%;padding:11px 14px;border-radius:9px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:.95rem;font-family:Inter;outline:none"/></div>

</div>
<div id="res" style="display:none" class="card" style="text-align:center">
  <img id="ri" style="max-width:100%;border-radius:10px;margin-bottom:14px;display:block"/>
  <button id="dlb" style="width:100%;padding:13px;border-radius:10px;background:#10b981;font-size:.95rem;font-weight:700;color:#fff;border:none;cursor:pointer">⬇️ Download PNG</button>
  <button onclick="location.reload()" style="width:100%;padding:11px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);font-size:.875rem;font-weight:600;color:var(--text);cursor:pointer;margin-top:10px">↺ Convert Another</button>
</div>

<script>
let svgText='',svgName='';
document.getElementById('fi').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;svgName=f.name;const r=new FileReader();r.onload=ev=>{svgText=ev.target.result;document.getElementById('sp').style.display='block'};r.readAsText(f);});
function convert(){
  const w=parseInt(document.getElementById('pw').value)||512;
  const h=parseInt(document.getElementById('ph').value)||512;
  const blob=new Blob([svgText],{type:'image/svg+xml'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);c.toBlob(b=>{const bu=URL.createObjectURL(b);document.getElementById('ri').src=bu;document.getElementById('res').style.display='block';document.getElementById('dlb').onclick=()=>{const a=document.createElement('a');a.href=bu;a.download=svgName.replace('.svg','')+'-'+w+'x'+h+'.png';a.click()};URL.revokeObjectURL(url)},'image/png');};
  img.src=url;
}
</script>
