<div class="tool-wrap"><div class="tool-inner">
<div class="card">
  <div style="border:2px dashed var(--border);border-radius:12px;padding:48px 24px;text-align:center;cursor:pointer;position:relative" id="dz">
    <div style="font-size:2.5rem;margin-bottom:12px">💧</div>

        <div><label style="font-size:.82rem;color:var(--text2);display:block;margin-bottom:4px">Watermark Text</label><input type="text" id="wmText" value="© ZenithCraft" style="width:100%;padding:10px 12px;border-radius:9px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:Inter;outline:none"/></div>
        <div style="display:flex;gap:10px">
          <div style="flex:1"><label style="font-size:.82rem;color:var(--text2);display:block;margin-bottom:4px">Font size</label><input type="range" id="wmSize" min="10" max="120" value="40" style="width:100%;-webkit-appearance:none;height:4px;border-radius:4px;background:var(--bg3);outline:none"/></div>
          <div style="flex:1"><label style="font-size:.82rem;color:var(--text2);display:block;margin-bottom:4px">Opacity</label><input type="range" id="wmOpacity" min="10" max="100" value="50" style="width:100%;-webkit-appearance:none;height:4px;border-radius:4px;background:var(--bg3);outline:none"/></div>

        <div style="display:flex;gap:10px;align-items:center">

        <div><label style="font-size:.82rem;color:var(--text2);display:block;margin-bottom:6px">Position</label>

            <button onclick="setPos('top-left',this)" style="padding:7px;border-radius:7px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:.75rem;cursor:pointer">↖ TL</button>

            <button onclick="setPos('bottom-right',this)" style="padding:7px;border-radius:7px;background:linear-gradient(135deg,#7c3aed,#a855f7,#06b6d4);border:none;color:#fff;font-size:.75rem;cursor:pointer">↘ BR</button>

<script>
let img=null,pos='bottom-right';
document.getElementById('fi').addEventListener('change',e=>{if(e.target.files[0])load(e.target.files[0])});
function load(f){img=new Image();img.onload=()=>{document.getElementById('sp').style.display='block';applyWM()};img.src=URL.createObjectURL(f);}
function setPos(p,btn){pos=p;document.querySelectorAll('#sp button').forEach(b=>{if(['↖ TL','↑ TC','↗ TR','⊙ C','↙ BL','↘ BR'].includes(b.textContent)){b.style.background='var(--bg3)';b.style.color='var(--text2)';b.style.border='1px solid var(--border)'}});btn.style.background='linear-gradient(135deg,#7c3aed,#a855f7,#06b6d4)';btn.style.color='#fff';btn.style.border='none';}
function applyWM(){if(!img)return;const c=document.getElementById('cv');c.width=img.width;c.height=img.height;const ctx=c.getContext('2d');ctx.drawImage(img,0,0);const sz=parseInt(document.getElementById('wmSize').value);const op=parseInt(document.getElementById('wmOpacity').value)/100;const col=document.getElementById('wmColor').value;const txt=document.getElementById('wmText').value||'Watermark';ctx.font=`bold ${sz}px Inter,sans-serif`;ctx.fillStyle=col;ctx.globalAlpha=op;const pad=20;const tw=ctx.measureText(txt).width;let x,y;switch(pos){case'top-left':x=pad;y=sz+pad;break;case'top-center':x=(c.width-tw)/2;y=sz+pad;break;case'top-right':x=c.width-tw-pad;y=sz+pad;break;case'center':x=(c.width-tw)/2;y=(c.height+sz)/2;break;case'bottom-left':x=pad;y=c.height-pad;break;default:x=c.width-tw-pad;y=c.height-pad;}ctx.fillText(txt,x,y);const dlb=document.getElementById('dlb');dlb.style.display='block';dlb.onclick=()=>{c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='watermarked.png';a.click()},'image/png')};}
['wmText','wmSize','wmOpacity','wmColor'].forEach(id=>document.getElementById(id).addEventListener('input',applyWM));
</script>
