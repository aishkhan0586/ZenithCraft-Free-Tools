    <div><label style="font-size:.82rem;font-weight:600;color:var(--text2);display:block;margin-bottom:6px">Amount</label><input type="number" id="amt" value="3" min="1" max="50" style="width:100%;padding:11px 12px;border-radius:9px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:Inter;outline:none"/></div>

<script>
const WORDS=["lorem","ipsum","dolor","sit","amet","consectetur","adipiscing","elit","sed","do","eiusmod","tempor","incididunt","ut","labore","et","dolore","magna","aliqua","enim","ad","minim","veniam","quis","nostrud","exercitation","ullamco","laboris","nisi","aliquip","ex","ea","commodo","consequat","duis","aute","irure","in","reprehenderit","voluptate","velit","esse","cillum","eu","fugiat","nulla","pariatur","excepteur","sint","occaecat","cupidatat","non","proident","sunt","culpa","qui","officia","deserunt","mollit","anim","id","est","laborum","curabitur","pretium","tincidunt","lacus","nunc","pulvinar","sapien","ligula","eget","volutpat","accumsan","odio","cras","mattis","iaculis","ligula","turpis","pharetra","nisl","accumsan"];
function rw(){return WORDS[Math.floor(Math.random()*WORDS.length)];}
function sentence(){const len=5+Math.floor(Math.random()*15);const words=Array.from({length:len},rw);return words[0].charAt(0).toUpperCase()+words[0].slice(1)+' '+words.slice(1).join(' ')+'.';}
function paragraph(){const count=4+Math.floor(Math.random()*5);return Array.from({length:count},sentence).join(' ');}
function generate(){
  const unit=document.getElementById('unit').value;const amt=parseInt(document.getElementById('amt').value)||3;const sw=document.getElementById('startWith').value;
  let text='',count=0;
  if(unit==='paragraphs'){const paras=Array.from({length:amt},paragraph);if(sw==='lorem'&&paras.length>0)paras[0]='Lorem ipsum dolor sit amet, consectetur adipiscing elit. '+paras[0];text=paras.join('\n\n');count=text.split(/\s+/).filter(Boolean).length;}
  else if(unit==='sentences'){const sents=Array.from({length:amt},sentence);if(sw==='lorem'&&sents.length>0)sents[0]='Lorem ipsum dolor sit amet, consectetur adipiscing elit.';text=sents.join(' ');count=amt;}
  else{const words=Array.from({length:amt},rw);if(sw==='lorem'&&words.length>0)words.splice(0,Math.min(5,words.length),...'lorem ipsum dolor sit amet'.split(' '));text=words.join(' ');count=amt;}
  document.getElementById('output').textContent=text;document.getElementById('countInfo').textContent=count+' words generated';document.getElementById('res').style.display='block';
}
generate();
</script>
