<section class="tool-hero">
  <div style="max-width:680px;margin:0 auto;position:relative;z-index:1">
    <div class="tool-badge">📱 Security Tool</div>
    <h1>Free <span class="grad-text">QR Code Generator</span></h1>
    <p>Create QR codes for URLs, WiFi, email, phone and SMS. Download as PNG or SVG. No sign-up needed.</p>
  </div>
</section>
<div class="tool-wrap">
  <div class="tool-inner">
    <div class="left-col">
      <div class="card">
        <div class="type-tabs">
          <button class="type-tab active" data-type="url">🌐 URL</button>
          <button class="type-tab" data-type="text">📝 Text</button>
          <button class="type-tab" data-type="email">📧 Email</button>
          <button class="type-tab" data-type="phone">📞 Phone</button>
          <button class="type-tab" data-type="wifi">📶 WiFi</button>
          <button class="type-tab" data-type="sms">💬 SMS</button>
        </div>
        <div class="type-fields show" id="field-url"><div class="input-group"><label class="input-label">Website URL</label><input class="text-input" id="in-url" placeholder="https://example.com" type="url"/></div></div>
        <div class="type-fields" id="field-text"><div class="input-group"><label class="input-label">Text Content</label><textarea class="text-input" id="in-text" rows="4" placeholder="Enter any text…" style="resize:vertical"></textarea></div></div>
        <div class="type-fields" id="field-email"><div class="input-group"><label class="input-label">Email Address</label><input class="text-input" id="in-email" placeholder="hello@example.com" type="email"/></div><div class="input-group"><label class="input-label">Subject (optional)</label><input class="text-input" id="in-subject" placeholder="Subject line"/></div></div>
        <div class="type-fields" id="field-phone"><div class="input-group"><label class="input-label">Phone Number</label><input class="text-input" id="in-phone" placeholder="+1 234 567 8900" type="tel"/></div></div>
        <div class="type-fields" id="field-wifi"><div class="input-group"><label class="input-label">Network Name (SSID)</label><input class="text-input" id="in-ssid" placeholder="MyWiFiNetwork"/></div><div class="input-group"><label class="input-label">Password</label><input class="text-input" id="in-wpass" placeholder="WiFi password" type="password"/></div><div class="input-group"><label class="input-label">Security Type</label><select class="text-input" id="in-wtype"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option><option value="nopass">None (Open)</option></select></div></div>
        <div class="type-fields" id="field-sms"><div class="input-group"><label class="input-label">Phone Number</label><input class="text-input" id="in-sms-num" placeholder="+1 234 567 8900" type="tel"/></div><div class="input-group"><label class="input-label">Message (optional)</label><textarea class="text-input" id="in-sms-msg" rows="3" placeholder="Pre-filled message…" style="resize:vertical"></textarea></div></div>
        <button class="gen-btn" id="genBtn">📱 Generate QR Code</button>
      </div>
      <div class="card">
        <div class="settings-title">🎨 Customise</div>
        <div class="color-row"><label>Foreground Color</label><input type="color" id="fgColor" value="#7c3aed"/></div>
        <div class="color-row"><label>Background Color</label><input type="color" id="bgColor" value="#ffffff"/></div>
        <div class="size-row"><label>Size</label><input type="range" class="size-slider" id="sizeSlider" min="128" max="512" value="256" step="32"/><span id="sizeVal">256px</span></div>
      </div>
    </div>
    <div class="right-col">

          <button class="dl-btn png" id="dlPng">⬇️ Download PNG</button>

  </div>
</footer>
<script>
const themeBtn=document.getElementById('themeBtn');
const html=document.documentElement;
const sv=localStorage.getItem('zc-theme')||'dark';
if(sv==='light'){html.setAttribute('data-theme','light');themeBtn.textContent='☀️';}
themeBtn.addEventListener('click',()=>{const l=html.getAttribute('data-theme')==='light';html.setAttribute('data-theme',l?'dark':'light');themeBtn.textContent=l?'🌙':'☀️';localStorage.setItem('zc-theme',l?'dark':'light');});

let currentType='url';
document.querySelectorAll('.type-tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.type-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.type-fields').forEach(f=>f.classList.remove('show'));
    tab.classList.add('active');
    currentType=tab.dataset.type;
    document.getElementById('field-'+currentType).classList.add('show');
  });
});

document.getElementById('sizeSlider').addEventListener('input',function(){document.getElementById('sizeVal').textContent=this.value+'px';});

function getQRData(){
  switch(currentType){
    case 'url':return document.getElementById('in-url').value||'https://zenithcraft.example.com';
    case 'text':return document.getElementById('in-text').value||'Hello from ZenithCraft!';
    case 'email':{const e=document.getElementById('in-email').value;const s=document.getElementById('in-subject').value;return 'mailto:'+e+(s?'?subject='+encodeURIComponent(s):'');}
    case 'phone':return 'tel:'+document.getElementById('in-phone').value;
    case 'wifi':{const ssid=document.getElementById('in-ssid').value;const pass=document.getElementById('in-wpass').value;const type=document.getElementById('in-wtype').value;return `WIFI:T:${type};S:${ssid};P:${pass};;`;}
    case 'sms':{const num=document.getElementById('in-sms-num').value;const msg=document.getElementById('in-sms-msg').value;return 'sms:'+num+(msg?'?body='+encodeURIComponent(msg):'');}
    default:return 'https://zenithcraft.example.com';
  }
}

document.getElementById('genBtn').addEventListener('click',()=>{
  const data=getQRData();
  const size=parseInt(document.getElementById('sizeSlider').value);
  const fg=document.getElementById('fgColor').value;
  const bg=document.getElementById('bgColor').value;
  const canvas=document.getElementById('qrCanvas');
  QRCode.toCanvas(canvas,data,{width:size,color:{dark:fg,light:bg},errorCorrectionLevel:'M'},err=>{
    if(err){alert('Error generating QR code: '+err.message);return;}
    document.getElementById('qrPlaceholder').style.display='none';
    document.getElementById('qrPlaceholderText').style.display='none';
    canvas.style.display='block';
    document.getElementById('downloadRow').style.display='flex';
  });
});

document.getElementById('dlPng').addEventListener('click',()=>{
  const canvas=document.getElementById('qrCanvas');
  const a=document.createElement('a');
  a.download='qrcode-zenithcraft.png';
  a.href=canvas.toDataURL('image/png');
  a.click();
});

document.getElementById('dlSvg').addEventListener('click',()=>{
  const data=getQRData();
  const fg=document.getElementById('fgColor').value;
  const bg=document.getElementById('bgColor').value;
  QRCode.toString(data,{type:'svg',color:{dark:fg,light:bg},errorCorrectionLevel:'M'},(err,svg)=>{
    if(err)return;
    const blob=new Blob([svg],{type:'image/svg+xml'});
    const a=document.createElement('a');
    a.download='qrcode-zenithcraft.svg';
    a.href=URL.createObjectURL(blob);
    a.click();
  });
});
</script>
</body>
