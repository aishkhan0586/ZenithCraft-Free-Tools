<div class="tool-wrap"><div class="tool-inner">
<div class="card">
  <label style="font-size:.85rem;font-weight:600;color:var(--text2);display:block;margin-bottom:8px">Paste your text</label>
  <textarea id="txt" placeholder="Paste your text here to check for spelling mistakes, double words, and common errors…" style="width:100%;min-height:220px;padding:16px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:Inter;font-size:.9rem;line-height:1.7;resize:vertical;outline:none;margin-bottom:14px"></textarea>
  <button onclick="checkGrammar()" style="width:100%;padding:14px;border-radius:11px;background:var(--grad);font-size:1rem;font-weight:700;color:#fff;border:none;cursor:pointer">✨ Check Grammar</button>
</div>
<div id="res" style="display:none" class="card">
  <div id="summary" style="display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap"></div>
  <div id="issues" style="display:flex;flex-direction:column;gap:10px"></div>
  <div id="highlighted" style="margin-top:16px;padding:16px;background:var(--bg3);border-radius:10px;font-size:.9rem;line-height:1.8"></div>
</div>
</div></div>
<script>
function checkGrammar(){
  const text=document.getElementById('txt').value;
  if(!text.trim()){alert('Please enter some text.');return;}
  const issues=[];
  const words=text.split(/\s+/);
  for(let i=0;i<words.length-1;i++){const w1=words[i].replace(/[^a-z]/gi,'').toLowerCase();const w2=words[i+1].replace(/[^a-z]/gi,'').toLowerCase();if(w1&&w1===w2)issues.push({type:'double',msg:'Double word: "'+words[i]+'"',word:words[i]});}
  const badChars=[{re:/\bi\b(?!')/g,fix:'I',msg:'Lowercase "i" should be "I"'},{re:/\.{3}/g,fix:'…',msg:'Use ellipsis (…) instead of three dots'},{re:/  +/g,fix:' ',msg:'Multiple spaces found'}];
  badChars.forEach(r=>{if(r.re.test(text))issues.push({type:'style',msg:r.msg,fix:r.fix});});
  const capRe=/(?<=[.!?]\s+)[a-z]/g;let m;while((m=capRe.exec(text))!==null)issues.push({type:'cap',msg:'Sentence should start with capital letter at position '+m.index,pos:m.index});
  const summary=document.getElementById('summary');summary.innerHTML=issues.length===0?`<span style="color:#10b981;font-weight:700;font-size:.95rem">✅ No issues found — looks good!</span>`:`<span style="font-size:.85rem;font-weight:600;color:#f59e0b">⚠️ ${issues.length} issue${issues.length!==1?'s':''} found</span>`;
  const issueEl=document.getElementById('issues');issueEl.innerHTML=issues.map(i=>`<div style="padding:12px 14px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);border-radius:9px;font-size:.85rem;color:var(--text2)">${i.msg}</div>`).join('');
  document.getElementById('res').style.display='block';
}
</script>
