<script>
const DB={photography:['photography','photo','photographer','photooftheday','picoftheday','instagood','photoshoot','portrait','naturephotography','travelphotography','streetphotography','landscapephotography','blackandwhite','sunset','beautifuldestinations'],fitness:['fitness','workout','gym','fitnessmotivation','fit','health','training','exercise','bodybuilding','weightloss','healthylifestyle','motivation','fitnessjourney','personaltrainer','gains'],travel:['travel','travelgram','instatravel','wanderlust','travelphotography','traveling','adventure','explore','traveltheworld','vacation','trip','holiday','backpacking','solotravel','travelblogger'],cooking:['cooking','food','foodie','foodphotography','recipe','homemade','foodstagram','instafood','yummy','delicious','chef','kitchen','healthyfood','lunch','dinner'],technology:['technology','tech','innovation','startup','software','coding','programming','developer','ai','machinelearning','digitaltransformation','cybersecurity','iot','cloudcomputing','webdev'],fashion:['fashion','style','ootd','fashionista','streetstyle','outfit','clothing','accessories','designer','luxury','trending','instafashion','fashionblogger','vintage','sustainable'],business:['business','entrepreneur','marketing','startup','success','leadership','motivation','entrepreneurship','smallbusiness','branding','digitalmarketing','networking','growthmindset','b2b','strategy'],art:['art','artwork','artist','drawing','painting','illustration','digitalart','creative','design','sketch','contemporaryart','fineart','artoftheday','abstract','watercolor']};
let platform='all';
function setPlatform(p,btn){platform=p;document.querySelectorAll('[onclick^="setPlatform"]').forEach(b=>{b.style.background='var(--bg3)';b.style.color='var(--text2)';b.style.border='1px solid var(--border)'});btn.style.background='linear-gradient(135deg,#7c3aed,#a855f7,#06b6d4)';btn.style.color='#fff';btn.style.border='none';}
function generate(){
  const topic=document.getElementById('topic').value.trim().toLowerCase().replace(/\s+/g,'');
  if(!topic){alert('Please enter a topic or keyword.');return;}
  let tags=[];
  Object.keys(DB).forEach(k=>{if(topic.includes(k)||k.includes(topic))tags=[...tags,...DB[k]];});
  if(tags.length===0){tags=[topic,topic+'daily',topic+'life',topic+'community',topic+'lovers',topic+'fan','love'+topic,'best'+topic,'top'+topic,'amazing'+topic,'beautiful'+topic,'incredible'+topic,'daily'+topic,'my'+topic,topic+'photography',topic+'gram',topic+'style',topic+'tips',topic+'ideas',topic+'inspiration',topic+'motivation',topic+'goals'];}
  const unique=[...new Set(tags)].sort(()=>Math.random()-.5);
  const count=platform==='twitter'?10:platform==='linkedin'?5:30;
  const selected=unique.slice(0,Math.min(count,unique.length));
  const cloud=document.getElementById('tagCloud');cloud.innerHTML=selected.map(t=>`<button onclick="navigator.clipboard.writeText('#${t}')" style="padding:6px 12px;border-radius:50px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.25);color:var(--accent2);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s" onmouseover="this.style.background='rgba(168,85,247,.25)'" onmouseout="this.style.background='rgba(168,85,247,.12)'">#${t}</button>`).join('');
  const text=selected.map(t=>'#'+t).join(' ');document.getElementById('tagText').value=text;document.getElementById('hashInfo').textContent=selected.length+' hashtags generated for "'+topic+'"';document.getElementById('res').style.display='block';
}
function copyAll(){const t=document.getElementById('tagText').value;navigator.clipboard.writeText(t).then(()=>{const btn=document.getElementById('cpBtn');btn.textContent='✅ Copied!';setTimeout(()=>btn.textContent='📋 Copy All',2000);});}
document.getElementById('topic').addEventListener('keydown',e=>{if(e.key==='Enter')generate();});
</script>
