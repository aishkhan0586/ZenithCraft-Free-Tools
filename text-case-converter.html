    <div class="tool-badge">🔤 Text Tool</div>
    <h1>Free <span class='grad-text'>Text Case Converter</span></h1>
    <p>Convert text between 8 different case formats instantly. Paste your text and get all formats at once.</p>
  </div>
</section>

<div class="tool-wrap"><div class="tool-inner" style="max-width:860px;margin:0 auto">
<textarea id="inputText" placeholder="Paste or type your text here…" style="width:100%;min-height:160px;padding:18px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;color:var(--text);font-family:Inter,sans-serif;font-size:0.95rem;line-height:1.7;resize:vertical;outline:none;margin-bottom:16px;transition:border-color .25s"></textarea>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px" id="resultsGrid"></div>
</div></div>
<script>
const cases=[
  {label:'UPPERCASE',icon:'🔠',fn:t=>t.toUpperCase()},
  {label:'lowercase',icon:'🔡',fn:t=>t.toLowerCase()},
  {label:'Title Case',icon:'📝',fn:t=>t.replace(/\w\S*/g,w=>w[0].toUpperCase()+w.slice(1).toLowerCase())},
  {label:'Sentence case',icon:'✏️',fn:t=>t.charAt(0).toUpperCase()+t.slice(1).toLowerCase()},
  {label:'camelCase',icon:'🐪',fn:t=>t.replace(/(?:^\w|[A-Z]|\b\w)/g,(w,i)=>i===0?w.toLowerCase():w.toUpperCase()).replace(/\s+/g,'')},
  {label:'PascalCase',icon:'🏛️',fn:t=>t.replace(/(?:^|\s+)(\w)/g,(_,c)=>c.toUpperCase()).replace(/\s+/g,'')},
  {label:'snake_case',icon:'🐍',fn:t=>t.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'')},
  {label:'kebab-case',icon:'🍢',fn:t=>t.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'')},
  {label:'CONSTANT_CASE',icon:'⚡',fn:t=>t.toUpperCase().replace(/\s+/g,'_').replace(/[^A-Z0-9_]/g,'')},
  {label:'Reverse',icon:'🔄',fn:t=>t.split('').reverse().join('')},
];
function buildGrid(text){
  const grid=document.getElementById('resultsGrid');
  grid.innerHTML=cases.map(c=>{
    const result=text?c.fn(text):'';
    return `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;transition:border-color .25s" onmouseover="this.style.borderColor='rgba(168,85,247,0.4)'" onmouseout="this.style.borderColor='var(--border)'">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)">${c.icon} ${c.label}</span>
        <button onclick="copyText('${btoa(unescape(encodeURIComponent(result)))}',this)" style="font-size:0.75rem;font-weight:600;color:var(--accent2);background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px;background:rgba(168,85,247,.1)">Copy</button>
      </div>
      <div style="font-size:0.9rem;color:var(--text);word-break:break-word;min-height:24px;font-family:monospace">${result||'<span style="color:var(--text3)">Output appears here…</span>'}</div>
    </div>`;
  }).join('');
}
function copyText(b64,btn){const t=decodeURIComponent(escape(atob(b64)));navigator.clipboard.writeText(t).then(()=>{const o=btn.textContent;btn.textContent='✓';setTimeout(()=>btn.textContent=o,1500);});}
document.getElementById('inputText').addEventListener('input',function(){buildGrid(this.value);});
buildGrid('');
</script>
