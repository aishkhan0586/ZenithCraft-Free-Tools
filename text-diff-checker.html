<script>
function diff(){
  const a=document.getElementById('t1').value;const b=document.getElementById('t2').value;
  if(!a&&!b){alert('Please paste text in both fields.');return;}
  const wa=a.split(/\s+/);const wb=b.split(/\s+/);
  const lcs=buildLCS(wa,wb);
  let html='';let added=0,removed=0,unchanged=0;
  let i=0,j=0,k=0;
  while(i<wa.length||j<wb.length){
    if(i<wa.length&&j<wb.length&&k<lcs.length&&wa[i]===lcs[k]&&wb[j]===lcs[k]){html+=wa[i]+' ';i++;j++;k++;unchanged++;}
    else if(j<wb.length&&(k>=lcs.length||wb[j]!==lcs[k])){html+=`<mark style="background:rgba(16,185,129,.25);border-radius:3px;padding:1px 3px">${wb[j]}</mark> `;j++;added++;}
    else if(i<wa.length){html+=`<del style="background:rgba(239,68,68,.2);border-radius:3px;padding:1px 3px;text-decoration:line-through;color:#ef4444">${wa[i]}</del> `;i++;removed++;}
    else break;
  }
  document.getElementById('addedCount').textContent='+ '+added+' added';
  document.getElementById('removedCount').textContent='− '+removed+' removed';
  document.getElementById('unchangedCount').textContent='= '+unchanged+' unchanged';
  document.getElementById('diffOutput').innerHTML=html;
  document.getElementById('res').style.display='block';
}
function buildLCS(a,b){const m=a.length,n=b.length;const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){if(a[i-1]===b[j-1])dp[i][j]=dp[i-1][j-1]+1;else dp[i][j]=Math.max(dp[i-1][j],dp[i][j-1]);}const res=[];let i=m,j=n;while(i>0&&j>0){if(a[i-1]===b[j-1]){res.unshift(a[i-1]);i--;j--;}else if(dp[i-1][j]>dp[i][j-1])i--;else j--;}return res;}
</script>
