<script>
let f=null,fmt='image/jpeg',fmtExt='jpg',blob=null;
function setFmt(m,e,btn){fmt=m;fmtExt=e.toLowerCase();document.querySelectorAll('#fmts button').forEach(b=>{b.style.background='var(--bg3)';b.style.color='var(--text2)';b.style.border='1px solid var(--border)'});btn.style.background='linear-gradient(135deg,#7c3aed,#a855f7,#06b6d4)';btn.style.color='#fff';btn.style.border='none';}
document.getElementById('dz').addEventListener('dragover',e=>{e.preventDefault();document.getElementById('dz').style.borderColor='var(--accent2)'});
document.getElementById('dz').addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0])load(e.dataTransfer.files[0])});
document.getElementById('fi').addEventListener('change',e=>{if(e.target.files[0])load(e.target.files[0])});
function load(file){f=file;document.getElementById('sp').style.display='block';}
function convert(){const img=new Image();const url=URL.createObjectURL(f);img.onload=()=>{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);c.toBlob(b=>{blob=b;const bu=URL.createObjectURL(b);document.getElementById('ri').src=bu;document.getElementById('rinfo').textContent='Converted to '+fmtExt.toUpperCase()+' — '+formatBytes(b.size);document.getElementById('res').style.display='block';document.getElementById('dlb').onclick=()=>{const a=document.createElement('a');a.href=bu;a.download=f.name.replace(/\.[^/.]+$/,'')+'.'+fmtExt;a.click()};URL.revokeObjectURL(url)},fmt,0.92)};img.src=url;}
function formatBytes(b){if(b>=1048576)return(b/1048576).toFixed(2)+' MB';if(b>=1024)return(b/1024).toFixed(1)+' KB';return b+' B';}
</script>
