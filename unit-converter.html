<div class="tool-wrap"><div class="tool-inner">
<div class="card">
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px" id="catBtns">
    <button onclick="setCat('length',this)" style="padding:9px 18px;border-radius:9px;font-size:.82rem;font-weight:600;background:var(--grad);color:#fff;border:none;cursor:pointer">📏 Length</button>
    <button onclick="setCat('weight',this)" style="padding:9px 18px;border-radius:9px;font-size:.82rem;font-weight:600;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer">⚖️ Weight</button>
    <button onclick="setCat('temp',this)" style="padding:9px 18px;border-radius:9px;font-size:.82rem;font-weight:600;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer">🌡️ Temperature</button>
    <button onclick="setCat('area',this)" style="padding:9px 18px;border-radius:9px;font-size:.82rem;font-weight:600;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer">📐 Area</button>
  </div>
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px">
    <div style="flex:1;min-width:120px"><label style="font-size:.82rem;font-weight:600;color:var(--text2);display:block;margin-bottom:6px">Value</label><input type="number" id="val" value="1" style="width:100%;padding:12px 14px;border-radius:9px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:1rem;font-family:Inter;outline:none"/></div>
    <div style="flex:1;min-width:120px"><label style="font-size:.82rem;font-weight:600;color:var(--text2);display:block;margin-bottom:6px">From</label><select id="fromUnit" style="width:100%;padding:12px;border-radius:9px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:Inter;outline:none"></select></div>
    <div style="flex:1;min-width:120px"><label style="font-size:.82rem;font-weight:600;color:var(--text2);display:block;margin-bottom:6px">To</label><select id="toUnit" style="width:100%;padding:12px;border-radius:9px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:Inter;outline:none"></select></div>
  </div>
  <button onclick="convert()" style="width:100%;padding:14px;border-radius:11px;background:var(--grad);font-size:1rem;font-weight:700;color:#fff;border:none;cursor:pointer">📏 Convert</button>
</div>
<div id="res" style="display:none;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:28px;text-align:center">
  <div id="resVal" style="font-size:2.5rem;font-weight:900;background:linear-gradient(135deg,#7c3aed,#a855f7,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px"></div>
  <div id="resLabel" style="font-size:.9rem;color:var(--text2)"></div>
</div>
</div></div>
<script>
const CATS={
  length:{units:['mm','cm','m','km','in','ft','yd','mi'],toBase:{mm:0.001,cm:0.01,m:1,km:1000,in:0.0254,ft:0.3048,yd:0.9144,mi:1609.344}},
  weight:{units:['mg','g','kg','lb','oz','stone','t'],toBase:{mg:0.000001,g:0.001,kg:1,lb:0.453592,oz:0.0283495,stone:6.35029,t:1000}},
  temp:{units:['C','F','K'],special:true},
  area:{units:['mm2','cm2','m2','km2','in2','ft2','yd2','acre','ha'],toBase:{'mm2':1e-6,'cm2':1e-4,'m2':1,'km2':1e6,'in2':0.00064516,'ft2':0.092903,'yd2':0.836127,'acre':4046.86,'ha':10000}}
};
let currentCat='length';
function setCat(cat,btn){currentCat=cat;document.querySelectorAll('#catBtns button').forEach(b=>{b.style.background='var(--bg3)';b.style.color='var(--text2)';b.style.border='1px solid var(--border)'});btn.style.background='linear-gradient(135deg,#7c3aed,#a855f7,#06b6d4)';btn.style.color='#fff';btn.style.border='none';buildSelects();}
function buildSelects(){const units=CATS[currentCat].units;['fromUnit','toUnit'].forEach((id,i)=>{const s=document.getElementById(id);s.innerHTML=units.map((u,j)=>`<option value="${u}"${(i===0&&j===0)||(i===1&&j===1)?'selected':''}>${u}</option>`).join('')});}
function convertTemp(val,from,to){let c;if(from==='C')c=val;else if(from==='F')c=(val-32)*5/9;else c=val-273.15;if(to==='C')return c;if(to==='F')return c*9/5+32;return c+273.15;}
function convert(){
  const val=parseFloat(document.getElementById('val').value);const from=document.getElementById('fromUnit').value;const to=document.getElementById('toUnit').value;
  if(isNaN(val)){alert('Please enter a valid number.');return;}
  let result;
  if(currentCat==='temp')result=convertTemp(val,from,to);
  else{const cat=CATS[currentCat];result=val*cat.toBase[from]/cat.toBase[to];}
  const formatted=result%1===0?result.toLocaleString():(result<0.001?result.toExponential(4):parseFloat(result.toPrecision(8)).toLocaleString());
  document.getElementById('resVal').textContent=formatted+' '+to;
  document.getElementById('resLabel').textContent=val+' '+from+' = '+formatted+' '+to;
  document.getElementById('res').style.display='block';
}
buildSelects();
</script>
