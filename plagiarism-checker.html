<div class="tool-wrap"><div class="tool-inner">
<div class="card">
  <label style="font-size:.85rem;font-weight:600;color:var(--text2);display:block;margin-bottom:8px">Paste your text below</label>
  <textarea id="txt" placeholder="Paste the text you want to check for duplicate sentences and self-plagiarism…&#10;&#10;This tool detects repeated phrases and calculates an originality score based on sentence uniqueness within your text." style="width:100%;min-height:220px;padding:16px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:Inter;font-size:.9rem;line-height:1.7;resize:vertical;outline:none;margin-bottom:14px;transition:border-color .25s"></textarea>
  <button onclick="check()" style="width:100%;padding:14px;border-radius:11px;background:var(--grad);font-size:1rem;font-weight:700;color:#fff;border:none;cursor:pointer">🛡️ Check Originality</button>
</div>
<div id="res" style="display:none" class="card">
  <div style="display:flex;align-items:center;gap:24px;margin-bottom:24px;flex-wrap:wrap">
    <div style="text-align:center"><div id="scoreNum" style="font-size:3rem;font-weight:900;line-height:1"></div><div style="font-size:.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-top:4px">Originality Score</div></div>
    <div style="flex:1"><div id="scoreBar" style="height:10px;border-radius:5px;background:var(--bg3);overflow:hidden;margin-bottom:8px"><div id="scoreBarFill" style="height:100%;border-radius:5px;transition:width .6s ease"></div></div><div id="scoreLabel" style="font-size:.875rem;font-weight:600"></div></div>
  </div>
  <div id="highlighted" style="font-size:.9rem;line-height:1.8;color:var(--text2)"></div>
</div>
</div></div>
<script>
function check(){
  const text=document.getElementById('txt').value.trim();
  if(!text){alert('Please paste some text to check.');return;}
  const sentences=text.match(/[^.!?]+[.!?]+/g)||[text];
  const seen={};const dups=new Set();
  sentences.forEach(s=>{const norm=s.trim().toLowerCase().replace(/\s+/g,' ');if(seen[norm])dups.add(norm);else seen[norm]=true;});
  const total=sentences.length;const dupCount=dups.size;
  const score=Math.max(0,Math.round((1-(dupCount/Math.max(total,1)))*100));
  const scoreEl=document.getElementById('scoreNum');
  scoreEl.textContent=score+'%';
  const fill=document.getElementById('scoreBarFill');
  fill.style.width=score+'%';
  let color,label;
  if(score>=90){color='#10b981';label='✅ Excellent — Highly Original';scoreEl.style.color='#10b981';}
  else if(score>=70){color='#06b6d4';label='🔵 Good — Mostly Original';scoreEl.style.color='#06b6d4';}
  else if(score>=50){color='#f59e0b';label='⚠️ Fair — Some Duplication';scoreEl.style.color='#f59e0b';}
  else{color='#ef4444';label='🔴 Needs Work — High Duplication';scoreEl.style.color='#ef4444';}
  fill.style.background=color;
  document.getElementById('scoreLabel').textContent=label+' ('+dupCount+' duplicate sentence'+(dupCount!==1?'s':'')+' out of '+total+')';
  const highlighted=sentences.map(s=>{const norm=s.trim().toLowerCase().replace(/\s+/g,' ');return dups.has(norm)?`<mark style="background:rgba(239,68,68,.2);border-radius:4px;padding:1px 3px;color:var(--text)">${s}</mark>`:s;}).join(' ');
  document.getElementById('highlighted').innerHTML='<div style="font-size:.8rem;font-weight:700;text-transform:uppercase;color:var(--text3);margin-bottom:10px">Highlighted Duplicates</div>'+highlighted;
  document.getElementById('res').style.display='block';
}
</script>
