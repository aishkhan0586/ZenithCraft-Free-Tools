<div class="tool-wrap"><div class="tool-inner">
<div class="card">
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px">
    <div style="flex:1;min-width:120px"><label style="font-size:.82rem;font-weight:600;color:var(--text2);display:block;margin-bottom:6px">Value</label><input type="number" id="val" value="1" style="width:100%;padding:12px 14px;border-radius:9px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:1rem;font-family:Inter;outline:none"/></div>

<div id="res" style="display:none;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:28px;text-align:center">
  <div id="resVal" style="font-size:2.5rem;font-weight:900;background:linear-gradient(135deg,#7c3aed,#a855f7,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px"></div>

<script>
const UNITS=[{name:'Bit',bits:1},{name:'Byte',bits:8},{name:'KB (SI)',bits:8000},{name:'KiB',bits:8192},{name:'MB (SI)',bits:8e6},{name:'MiB',bits:8388608},{name:'GB (SI)',bits:8e9},{name:'GiB',bits:8589934592},{name:'TB (SI)',bits:8e12},{name:'TiB',bits:8796093022208}];
function convert(){
  const val=parseFloat(document.getElementById('val').value);
  const from=parseFloat(document.getElementById('fromUnit').value);
  const to=parseFloat(document.getElementById('toUnit').value);
  if(isNaN(val))return;
  const bits=val*from;
  const result=bits/to;
  const toName=document.getElementById('toUnit').selectedOptions[0].text;
  const fromName=document.getElementById('fromUnit').selectedOptions[0].text;
  const fmt=n=>n%1===0?n.toLocaleString():(n<0.001?n.toExponential(3):parseFloat(n.toPrecision(6)).toLocaleString());
  document.getElementById('resVal').textContent=fmt(result)+' '+toName;
  document.getElementById('resLabel').textContent=val+' '+fromName+' = '+fmt(result)+' '+toName;
  const all=UNITS.map(u=>`<div style="background:var(--bg3);border-radius:8px;padding:10px"><div style="font-size:.7rem;color:var(--text3);margin-bottom:3px">${u.name}</div><div style="font-size:.85rem;font-weight:700;color:var(--text)">${fmt(bits/u.bits)}</div></div>`).join('');
  document.getElementById('allConversions').innerHTML=all;
  document.getElementById('res').style.display='block';
}
convert();
</script>
